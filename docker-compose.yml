services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cube:
    image: cubejs/cube:latest
    container_name: cube
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DB_TYPE=clickhouse
      - CUBEJS_DB_HOST=clickhouse
      - CUBEJS_DB_PORT=8123
      - CUBEJS_DB_NAME=datasets
      - CUBEJS_DB_USER=default
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-your-very-secret-token}
      - CUBEJS_DEV_MODE=true
    volumes:
      - ./cube/model:/cube/conf/model
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  seed:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: seed
    environment:
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["python", "ingest_data.py", "--sample"]
    # To load the full dataset instead: command: ["python", "ingest_data.py"]

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: mcp-server
    ports:
      - "8000:8000"
    environment:
      - CUBEJS_API_URL=http://cube:4000/cubejs-api/v1
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-your-very-secret-token}
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      cube:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./mcp_server:/app

volumes:
  clickhouse_data:
